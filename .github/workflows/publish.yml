name: Build and Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger only on version tags

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels-${{ strategy.job-index }}
          path: wheelhouse/*

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload Linux Arm wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm-wheels-${{ strategy.job-index }}
          path: wheelhouse/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheels-${{ strategy.job-index }}
          path: wheelhouse/*

  build-macos-intel:
    runs-on: macos-15-intel
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_ARCHS_MACOS: x86_64
          PYTHON_VERSION: ${{ matrix.python-version }}
          CIBW_TEST_SKIP: "*"
        run: |
          if [ "$PYTHON_VERSION" = "3.9" ]; then
            export CIBW_BUILD="cp39-*"
          elif [ "$PYTHON_VERSION" = "3.10" ]; then
            export CIBW_BUILD="cp310-*"
          elif [ "$PYTHON_VERSION" = "3.11" ]; then
            export CIBW_BUILD="cp311-*"
          elif [ "$PYTHON_VERSION" = "3.12" ]; then
            export CIBW_BUILD="cp312-*"
          elif [ "$PYTHON_VERSION" = "3.13" ]; then
            export CIBW_BUILD="cp313-*"
          fi

          cibuildwheel --output-dir wheelhouse --verbose

      - name: Upload macOS Intel wheels
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-wheels-${{ strategy.job-index }}
          path: wheelhouse/*

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel

      - name: Build wheels
        run: |
          cibuildwheel --output-dir wheelhouse

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels-${{ strategy.job-index }}
          path: wheelhouse/*

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm, build-macos, build-macos-intel, build-windows]
    if: startsWith(github.ref, 'refs/tags')
    
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wheels-*"
          path: ./wheelhouse
          merge-multiple: true

      - name: Install Twine
        run: |
          python -m pip install --upgrade twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload wheelhouse/*
